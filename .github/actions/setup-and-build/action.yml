name: Setup and Build
description: Reusable composite action for Node setup, install, optional lint/test, and build

inputs:
  node-version:
    description: Node.js version to use
    default: "24"
  registry-url:
    description: npm registry URL (optional)
    required: false
    default: ""
  run-lint:
    description: Run lint step
    default: "false"
  run-test:
    description: Run test step
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Lint
      if: inputs.run-lint == 'true'
      run: npm run lint
      shell: bash

    - name: Test
      if: inputs.run-test == 'true'
      run: npm test
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
